<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Philippines to Copenhagen, one stop (MapLibre)</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  :root { --ink:#e8eef2; --dim:#8fa3b0; --panel:rgba(9,20,30,.82); --gold:#ffd166; }
  html,body { margin:0; height:100%; background:#050b12; font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif; color:var(--ink); }
  #map { position:absolute; inset:0; }
  #panel { position:absolute; top:16px; left:16px; width:250px; padding:16px; background:var(--panel); border-radius:10px; backdrop-filter:blur(6px); }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; line-height:1.25; }
  p { margin:0 0 12px; font-size:13px; color:var(--dim); line-height:1.4; }
  button { display:flex; align-items:center; gap:10px; width:100%; margin:0 0 6px; padding:8px 10px; background:transparent; color:var(--ink);
    border:1px solid rgba(255,255,255,.18); border-radius:6px; font:inherit; font-size:14px; cursor:pointer; text-align:left; }
  button:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  button[aria-pressed="false"] { opacity:.4; }
  .sw { width:22px; height:4px; border-radius:2px; flex:none; }
  .leg { font-size:12px; color:var(--dim); margin-top:10px; display:flex; align-items:center; gap:8px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Philippines to Copenhagen, one stop</h1>
  <p>Each line is a leg of a one-transit trip. Toggle an origin to see its options.</p>
  <div id="toggles"></div>
  <div class="leg"><span class="sw" style="background:var(--gold)"></span>Transit to CPH</div>
</div>

<script>
const CPH = [12.6508, 55.6180];
const AP = { // [lon, lat]
  MNL:[121.0194,14.5086], CEB:[123.9794,10.3075], CRK:[120.5603,15.1858], DVO:[125.6458,7.1255],
  ILO:[122.5453,10.7130], TAG:[123.7528,9.5664], KLO:[122.3763,11.6794],
  DXB:[55.3657,25.2532], DOH:[51.6081,25.2731], AUH:[54.6511,24.4330], IST:[28.7519,41.2753],
  SIN:[103.9915,1.3644], BKK:[100.7501,13.6900], ICN:[126.4407,37.4602], HND:[139.7798,35.5494],
  PEK:[116.5844,40.0799], PVG:[121.8083,31.1443], DEL:[77.1000,28.5562], SGN:[106.6520,10.8188],
  YYZ:[-79.6248,43.6777], LAX:[-118.4085,33.9416], SFO:[-122.3790,37.6213], JFK:[-73.7781,40.6413],
  SEA:[-122.3088,47.4502], CDG:[2.5479,49.0097]
};
const ROUTES = {
  MNL:["DXB","DOH","AUH","IST","SIN","BKK","ICN","HND","PEK","PVG","DEL","SGN","YYZ","LAX","SFO","JFK","SEA","CDG"],
  CEB:["ICN","SIN","DXB","DOH","HND"],
  CRK:["ICN","SIN","DXB","DOH","HND"],
  DVO:["DOH","SIN"], ILO:["SIN"], TAG:["ICN"], KLO:["ICN"]
};
const COLORS = { MNL:"#4cc9f0", CEB:"#f72585", CRK:"#b8f25b", DVO:"#ff9e4a", ILO:"#c77dff", TAG:"#2ec4b6", KLO:"#ff6b6b" };
const NAMES = { MNL:"Manila", CEB:"Cebu", CRK:"Clark", DVO:"Davao", ILO:"Iloilo", TAG:"Tagbilaran", KLO:"Kalibo" };

// Great-circle interpolation, unwrapped in longitude so lines cross the antimeridian cleanly.
function arc(a, b, n = 80) {
  const r = Math.PI / 180, [lo1, la1] = [a[0]*r, a[1]*r], [lo2, la2] = [b[0]*r, b[1]*r];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1-f)*d)/Math.sin(d), B = Math.sin(f*d)/Math.sin(d);
    const x = A*Math.cos(la1)*Math.cos(lo1) + B*Math.cos(la2)*Math.cos(lo2);
    const y = A*Math.cos(la1)*Math.sin(lo1) + B*Math.cos(la2)*Math.sin(lo2);
    const z = A*Math.sin(la1) + B*Math.sin(la2);
    let lon = Math.atan2(y, x) / r;
    const lat = Math.atan2(z, Math.hypot(x, y)) / r;
    if (pts.length) { const p = pts[pts.length-1][0]; while (lon - p > 180) lon -= 360; while (lon - p < -180) lon += 360; }
    pts.push([lon, lat]);
  }
  return pts;
}

const active = new Set(Object.keys(ROUTES));

function build() {
  const legs = [], seenTransit = new Set(), pts = new Map();
  for (const o of active) {
    pts.set(o, { code:o, origin:true });
    for (const t of ROUTES[o]) {
      legs.push({ type:"Feature", properties:{ origin:o, kind:"a" }, geometry:{ type:"LineString", coordinates:arc(AP[o], AP[t]) } });
      if (!pts.has(t)) pts.set(t, { code:t, origin:false });
      if (!seenTransit.has(t)) {
        seenTransit.add(t);
        legs.push({ type:"Feature", properties:{ origin:"", kind:"b" }, geometry:{ type:"LineString", coordinates:arc(AP[t], CPH) } });
      }
    }
  }
  pts.set("CPH", { code:"CPH", origin:false, dest:true });
  const points = [...pts.values()].map(p => ({ type:"Feature",
    properties:{ code:p.code, kind:p.dest ? "dest" : p.origin ? "origin" : "transit" },
    geometry:{ type:"Point", coordinates: p.dest ? CPH : AP[p.code] } }));
  return { legs:{ type:"FeatureCollection", features:legs }, points:{ type:"FeatureCollection", features:points } };
}

function start() {
  const map = new maplibregl.Map({
    container:"map", style:"https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    center:[95, 30], zoom:1.6, attributionControl:{ compact:true }
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass:false }), "top-right");
  map.on("style.load", () => {
    map.setProjection({ type:"globe" });
    try { map.setSky({ "sky-color":"#0b1a2b", "horizon-color":"#1a3a63", "fog-color":"#0c1826", "sky-horizon-blend":0.6, "horizon-fog-blend":0.4, "atmosphere-blend":0.8 }); } catch (e) {}
    const d = build();
    map.addSource("legs", { type:"geojson", data:d.legs });
    map.addSource("pts", { type:"geojson", data:d.points });
    const colorMatch = ["match", ["get","origin"], ...Object.entries(COLORS).flat(), "#ffd166"];
    map.addLayer({ id:"legs-b", type:"line", source:"legs", filter:["==",["get","kind"],"b"],
      layout:{ "line-cap":"round" }, paint:{ "line-color":"#ffd166", "line-width":1.6, "line-opacity":0.75 } });
    map.addLayer({ id:"legs-a", type:"line", source:"legs", filter:["==",["get","kind"],"a"],
      layout:{ "line-cap":"round" }, paint:{ "line-color":colorMatch, "line-width":2, "line-opacity":0.9 } });
    map.addLayer({ id:"pts-c", type:"circle", source:"pts", paint:{
      "circle-radius":["match",["get","kind"],"dest",7,"origin",5,3.5],
      "circle-color":["match",["get","kind"],"dest","#ffd166","origin","#ffffff","#8fa3b0"],
      "circle-stroke-width":1, "circle-stroke-color":"#050b12" } });
    map.addLayer({ id:"pts-l", type:"symbol", source:"pts", layout:{
      "text-field":["get","code"], "text-font":["Montserrat Regular"], "text-size":11, "text-offset":[0,-1.1], "text-anchor":"bottom", "text-allow-overlap":false },
      paint:{ "text-color":"#e8eef2", "text-halo-color":"#050b12", "text-halo-width":1.2 } });
  });

  const box = document.getElementById("toggles");
  for (const o of Object.keys(ROUTES)) {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<span class="sw" style="background:${COLORS[o]}"></span>${NAMES[o]} (${o})`;
    b.onclick = () => {
      active.has(o) ? active.delete(o) : active.add(o);
      b.setAttribute("aria-pressed", active.has(o));
      const d = build();
      map.getSource("legs").setData(d.legs);
      map.getSource("pts").setData(d.points);
    };
    box.appendChild(b);
  }
}

start();
</script>
</body>
</html>
